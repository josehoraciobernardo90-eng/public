    <script>
      // Suprime avisos benignos de WebSocket/HMR desativado no iframe do AI Studio
      window.addEventListener('unhandledrejection', function (event) {
        var msg = (event && (event.reason ? (event.reason.message || event.reason) : '')) + '';
        if (msg.includes('WebSocket closed without opened') || msg.includes('[vite]') || msg.includes('websocket')) {
          event.preventDefault();
        }
      });
      window.addEventListener('error', function (event) {
        var msg = (event && (event.message || '')) + '';
        if (msg.includes('WebSocket closed without opened') || msg.includes('[vite]')) {
          event.preventDefault();
        }
      });
    </script>
